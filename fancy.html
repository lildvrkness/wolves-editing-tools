        fn:text =>
            [...text]
                .map(c => c === ' ' ? ' ' : c + '̃')
                .join('')
    },

    {
        name:"Spaced",
        search:"spaced spacing",
        fn:text =>
            [...text].join(' ')
    },

    {
        name:"Wide Spaced",
        search:"wide spaced",
        fn:text =>
            [...text].join('　')
    }

];


/* =========================================================
   CONVERTER
   ========================================================= */

function mapFont(text,pack) {

    const [U,L,N] = pack;

    return [...text].map(char => {

        const upper = AZ.indexOf(char);

        if(upper >= 0) {
            return [...U][upper] || char;
        }

        const lower = az.indexOf(char);

        if(lower >= 0) {
            return [...L][lower] || char;
        }

        const number = D.indexOf(char);

        if(number >= 0) {
            return [...N][number] || char;
        }

        return char;

    }).join('');
}


/* =========================================================
   COPY
   ========================================================= */

async function copyText(text) {

    try {

        await navigator.clipboard.writeText(text);

    } catch {

        const area = document.createElement('textarea');

        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';

        document.body.appendChild(area);

        area.select();
        document.execCommand('copy');

        area.remove();
    }

    const toast =
        document.getElementById('toast');

    toast.classList.add('show');

    setTimeout(() => {
        toast.classList.remove('show');
    },1200);
}


/* =========================================================
   RENDER
   ========================================================= */

function getStyles() {

    const output = [];

    Object.entries(fonts).forEach(([name,pack]) => {

        output.push({
            name,
            search:name,
            output:mapFont(
                document.getElementById('src').value,
                pack
            )
        });

    });

    specialStyles.forEach(style => {

        output.push({
            name:style.name,
            search:style.search,
            output:style.fn(
                document.getElementById('src').value
            )
        });

    });

    return output;
}


function render() {

    const query =
        document
            .getElementById('styleSearch')
            .value
            .trim()
            .toLowerCase();

    const styles =
        getStyles().filter(style => {

            if(!query) {
                return true;
            }

            return (
                style.name.toLowerCase().includes(query) ||
                style.search.toLowerCase().includes(query)
            );

        });

    const box =
        document.getElementById('styles');

    box.innerHTML = '';

    document.getElementById('styleCount').textContent =
        `${styles.length} style${styles.length === 1 ? '' : 's'} available`;


    if(!styles.length) {

        const empty =
            document.createElement('div');

        empty.className = 'empty';
        empty.textContent = 'No matching text styles.';

        box.appendChild(empty);

        return;
    }


    styles.forEach(style => {

        const row =
            document.createElement('div');

        row.className = 'style-row';


        const name =
            document.createElement('div');

        name.className = 'style-name';
        name.textContent = style.name;


        const output =
            document.createElement('div');

        output.className = 'style-out';
        output.textContent = style.output;


        const button =
            document.createElement('button');

        button.className = 'copy-btn';
        button.textContent = 'Copy';

        button.addEventListener(
            'click',
            () => copyText(style.output)
        );


        row.appendChild(name);
        row.appendChild(output);
        row.appendChild(button);

        box.appendChild(row);

    });

}


document
    .getElementById('src')
    .addEventListener('input',render);

document
    .getElementById('styleSearch')
    .addEventListener('input',render);


render();

</script>
