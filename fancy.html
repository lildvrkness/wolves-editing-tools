    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: "#9b5cff",
                        green: "#39ff88"
                    }
                }
            }
        };

        :root {

            --green:#39ff88;
            --ink:#030405;
        }

        * {

        }

        html {
            min-height:100%;
            background:var(--ink);
        }

        body {
            margin:0;
            min-height:100vh;
            font-family:Inter,sans-serif;
            color:#e5e7eb;
            background:

            padding:28px 16px 48px;
        }

        .background-grid {
            position:fixed;
            inset:0;
            pointer-events:none;
            opacity:.028;
            z-index:0;
            background-image:

                linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px);

        }

        .wolves-title {
            font-family:"New Rocker",cursive;
            letter-spacing:.025em;
            line-height:1.02;
        }

        .title-wolves {
            color:#39ff88;
            display:inline-block;
            text-shadow:

                0 0 24px rgba(57,255,136,.28);
            animation:wolvesPulse 2.8s ease-in-out infinite;
        }

        .title-rest {
            color:#9b5cff;
            display:inline-block;
            text-shadow:
                0 0 12px rgba(155,92,255,.55),
                0 0 24px rgba(155,92,255,.22);
            animation:albedoShimmer 4.2s ease-in-out infinite;
        }

        @keyframes wolvesPulse {
            0%,100% {
                text-shadow:
                    0 0 8px rgba(57,255,136,.4),
                    0 0 18px rgba(57,255,136,.18);
            }

            50% {
                text-shadow:
                    0 0 16px rgba(57,255,136,.85),
                    0 0 32px rgba(57,255,136,.4);
            }
        }

        @keyframes albedoShimmer {
            0%,100% {
                text-shadow:
                    0 0 10px rgba(155,92,255,.4),
                    0 0 20px rgba(155,92,255,.18);
            }

            50% {
                text-shadow:
                    0 0 18px rgba(155,92,255,.8),
                    0 0 32px rgba(155,92,255,.3);
            }
        }

        .card {
            background:linear-gradient(
                145deg,
                rgba(17,18,22,.96),
                rgba(8,9,11,.97)
            );
            border:1px solid #202229;
            border-radius:14px;
        }

        .shell {
            box-shadow:
                0 30px 80px rgba(0,0,0,.45),
                0 0 0 1px rgba(155,92,255,.08);
        }

        .input {
            width:100%;
            height:52px;
            background:rgba(3,4,5,.88);
            border:1px solid #292c34;
            border-radius:8px;
            padding:10px 14px;
            color:white;
            font-size:16px;
            outline:none;
            transition:.2s ease;
        }

        .input:hover {
            border-color:rgba(155,92,255,.45);
            box-shadow:0 0 14px rgba(155,92,255,.10);
        }

        .input:focus {
            border-color:#9b5cff;
            box-shadow:
                0 0 16px rgba(155,92,255,.22),
                0 0 35px rgba(155,92,255,.07);
        }

        .panel-title {
            font-size:15px;
            letter-spacing:.12em;
            text-transform:uppercase;
            font-weight:800;
            margin-bottom:12px;
        }

        .btn {
            height:40px;
            padding:0 12px;
            border-radius:8px;
            font-size:13px;
            font-weight:800;
            letter-spacing:.12em;
            text-transform:uppercase;
            cursor:pointer;
            border:0;
            background:#39ff88;
            color:#000;
            flex-shrink:0;
            transition:.2s ease;
        }

        .btn:hover {
            box-shadow:0 0 18px rgba(57,255,136,.28);
            transform:translateY(-1px);
        }

        .style-row {
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 14px;
            border:1px solid #262830;
            border-radius:10px;
            background:rgba(0,0,0,.28);
            margin-bottom:8px;
            transition:.2s ease;
        }

        .style-row:hover {
            border-color:rgba(155,92,255,.45);
            box-shadow:0 0 18px rgba(155,92,255,.08);
        }

        .style-name {
            width:125px;
            font-size:12px;
            font-weight:800;
            letter-spacing:.09em;
            text-transform:uppercase;
            color:#9b5cff;
            flex-shrink:0;
        }

        .style-out {
            flex:1;
            min-width:0;
            font-size:18px;
            color:#fff;
            overflow-x:auto;
            white-space:nowrap;
            scrollbar-width:thin;
        }

        .style-out::-webkit-scrollbar {
            height:4px;
        }

        .style-out::-webkit-scrollbar-thumb {
            background:#3a314a;
            border-radius:10px;
        }

        .combo {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:10px 12px;
            margin:0 7px 7px 0;
            border:1px solid #2a2d35;
            border-radius:10px;
            background:rgba(0,0,0,.35);
            cursor:pointer;
            font-size:18px;
            line-height:1.3;
            color:#fff;
            transition:border-color .2s, box-shadow .2s, transform .15s, background .2s;
        }

        .combo:hover {
            border-color:rgba(155,92,255,.7);
            box-shadow:0 0 16px rgba(155,92,255,.18);
            transform:translateY(-1px);
            background:rgba(155,92,255,.07);
        }

            font-size:12px;
            letter-spacing:.16em;
            text-transform:uppercase;
            font-weight:800;
            color:#39ff88;
            margin:20px 0 9px;
            padding-bottom:6px;
            border-bottom:1px solid rgba(57,255,136,.10);
        }

            display:flex;
            flex-wrap:wrap;
            gap:7px;
            margin-bottom:18px;
        }

            border:1px solid #292c34;
            background:rgba(0,0,0,.3);
            color:#a9aeb9;
            border-radius:999px;
            padding:7px 11px;
            font-size:11px;
            font-weight:800;
            letter-spacing:.06em;
            text-transform:uppercase;
            cursor:pointer;
            transition:.2s ease;
        }

        .category-btn:hover,
        .category-btn.active {
            color:#fff;
            border-color:rgba(57,255,136,.45);
            background:rgba(57,255,136,.07);
            box-shadow:0 0 14px rgba(57,255,136,.08);
        }

            position:relative;
            margin-bottom:16px;
        }

            padding-left:42px;
        }

        .search-icon {
            position:absolute;
            left:14px;
            top:50%;
            transform:translateY(-50%);
            color:#6d7280;
            pointer-events:none;
        }

        .empty {
            padding:24px;
            border:1px dashed #2b2e37;
            border-radius:10px;
            text-align:center;
            color:#717784;
            font-size:13px;
        }

        .toast {
            position:fixed;
            left:50%;
            bottom:22px;
            transform:translateX(-50%) translateY(12px);
            opacity:0;
            transition:.25s ease;
            z-index:20;
            pointer-events:none;
            background:#0b0c10;
            border:1px solid rgba(57,255,136,.3);
            color:#39ff88;
            padding:8px 14px;
            border-radius:10px;
            font-size:13px;
            font-weight:700;
        }

        .toast.show {
            opacity:1;
            transform:translateX(-50%) translateY(0);
        }

                font-size:10px;

</head>

            <div id="combos"></div>

        </section>

    </div>

</main>

/* =========================================================
   TEXT HELPERS
   ========================================================= */

function mapFont(text, pack) {

    const [U,L,N] = pack;

    return [...text].map(ch => {

        const iu = AZ.indexOf(ch);
        if(iu >= 0) return [...U][iu] || ch;

        const il = az.indexOf(ch);
        if(il >= 0) return [...L][il] || ch;

        const id = D.indexOf(ch);
        if(id >= 0) return [...N][id] || ch;

        return ch;

    }).join('');
}


function mapFlip(text) {

    return [...text]
        .reverse()
        .map(ch => flip[ch] || ch)
        .join('');
}


function wrap(text, left, right) {

    return [...text]
        .map(ch => ch === ' ' ? ' ' : left + ch + right)
        .join('');
}


function combining(text, mark) {

    return [...text]
        .map(ch => ch === ' ' ? ' ' : ch + mark)
        .join('');
}


async function copy(text) {

    try {

        await navigator.clipboard.writeText(text);

        const toast = document.getElementById('toast');

        toast.textContent = 'Copied ✓';
        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 1200);

    } catch {

        const area = document.createElement('textarea');

        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';

        document.body.appendChild(area);

        area.select();
        document.execCommand('copy');

        area.remove();

        const toast = document.getElementById('toast');

        toast.textContent = 'Copied ✓';
        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 1200);
    }
}

function renderStyles() {

    const src =
        document.getElementById('src').value ||
        ' ';

    const box =
        document.getElementById('styles');

    box.innerHTML = '';


    Object.entries(fonts).forEach(([name,pack]) => {

        createStyleRow(
            name,
            mapFont(src,pack)
        );

    });


    generatedStyles.forEach(style => {

        createStyleRow(
            style.name,
            style.fn(src)
        );

    });

}


function createStyleRow(name, out) {

    const box =
        document.getElementById('styles');

    const el =
        document.createElement('div');

    el.className = 'style-row';


    const label =
        document.createElement('div');

    label.className = 'style-name';
    label.textContent = name;


    const result =
        document.createElement('div');

    result.className = 'style-out';
    result.textContent = out;


    const btn =
        document.createElement('button');

    btn.className = 'btn';
    btn.textContent = 'Copy';

    btn.addEventListener(
        'click',
        () => copy(out)
    );


    el.appendChild(label);
    el.appendChild(result);
    el.appendChild(btn);

    box.appendChild(el);
}

/* =========================================================
   CATEGORY FILTER
   ========================================================= */

let activeCategory = 'All';


function renderCategoryNav() {

    const nav =
        document.getElementById('categoryNav');

    nav.innerHTML = '';


    const allCategories =
        ['All', ...Object.keys(combos)];


    allCategories.forEach(category => {

        const btn =
            document.createElement('button');

        btn.type = 'button';
        btn.className =
            'category-btn' +
            (category === activeCategory ? ' active' : '');

        btn.textContent = category;

        btn.addEventListener('click', () => {

            activeCategory = category;

            renderCategoryNav();
            renderCombos();

        });

        nav.appendChild(btn);

    });

}


function renderCombos() {

    const box =
        document.getElementById('combos');

    const search =
        document
            .getElementById('symbolSearch')
            .value
            .trim()
            .toLowerCase();


    box.innerHTML = '';


    let visibleCount = 0;


    Object.entries(combos).forEach(([category,items]) => {

        if(
            activeCategory !== 'All' &&
            activeCategory !== category
        ) {
            return;
        }


        const filtered =
            items.filter(txt =>
                !search ||
                txt.toLowerCase().includes(search)
            );


        if(!filtered.length) {
            return;
        }


        const heading =
            document.createElement('div');

        heading.className = 'cat';
        heading.textContent = category;

        box.appendChild(heading);


        filtered.forEach(txt => {

            const button =
                document.createElement('button');

            button.type = 'button';
            button.className = 'combo';
            button.textContent = txt;

            button.addEventListener(
                'click',
                () => copy(txt)
            );

            box.appendChild(button);

            visibleCount++;

        });

    });


    if(!visibleCount) {

        const empty =
            document.createElement('div');

        empty.className = 'empty';

        empty.textContent =
            'No symbols found. Try another search.';

        box.appendChild(empty);

    }

}


/* =========================================================
   EVENTS
   ========================================================= */

document
    .getElementById('src')
    .addEventListener(
        'input',
        renderStyles
    );


document
    .getElementById('symbolSearch')
    .addEventListener(
        'input',
        renderCombos
    );


renderStyles();
renderCategoryNav();
renderCombos();
