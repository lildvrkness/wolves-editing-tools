const flip = {
    a:'ɐ',b:'q',c:'ɔ',d:'p',e:'ǝ',f:'ɟ',g:'ƃ',h:'ɥ',i:'ᴉ',j:'ɾ',k:'ʞ',l:'l',m:'ɯ',n:'u',o:'o',p:'d',q:'b',r:'ɹ',s:'s',t:'ʇ',u:'n',v:'ʌ',w:'ʍ',x:'x',y:'ʎ',z:'z',
    A:'∀',B:'ᗺ',C:'Ɔ',D:'ᗡ',E:'Ǝ',F:'Ⅎ',G:'⅁',H:'H',I:'I',J:'ſ',K:'ʞ',L:'˥',M:'W',N:'N',O:'O',P:'Ԁ',Q:'Ό',R:'ᴚ',S:'S',T:'┴',U:'∩',V:'Λ',W:'M',X:'X',Y:'⅄',Z:'Z',
    '0':'0','1':'Ɩ','2':'ᄅ','3':'Ɛ','4':'ㄣ','5':'ϛ','6':'9','7':'ㄥ','8':'8','9':'6','?':'¿','!':'¡','.':'˙'
};

function mapFont(text, pack){
    const [U,L,N] = pack;
    return [...text].map(ch=>{
        const iu = AZ.indexOf(ch); if(iu>=0) return [...U][iu] || ch;
        const il = az.indexOf(ch); if(il>=0) return [...L][il] || ch;
        const id = D.indexOf(ch); if(id>=0) return [...N][id] || ch;
        return ch;
    }).join('');
}
function mapFlip(text){
    return [...text].reverse().map(ch=>flip[ch]||ch).join('');
}
function wrap(text, l, r){ return [...text].map(ch=> (ch===' '? ' ' : l+ch+r)).join(''); }

async function copy(text){
    try{
        await navigator.clipboard.writeText(text);
        const t=document.getElementById('toast');
        t.textContent='Copied';
        t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),1200);
    }catch{}
}

function renderStyles(){
    const src=document.getElementById('src').value || ' ';
    const box=document.getElementById('styles');
    box.innerHTML='';
    const rows = Object.entries(fonts).map(([name,pack])=>({name, out:mapFont(src,pack)}));
    rows.push({name:'Upside down', out:mapFlip(src)});
    rows.push({name:'Bubbles', out:wrap(src,'','⃝')});
    rows.push({name:'Slash', out:wrap(src,'','̷')});
    rows.push({name:'Strike', out:wrap(src,'','̶')});
    rows.push({name:'Underline', out:wrap(src,'','̲')});
    rows.forEach(row=>{
        const el=document.createElement('div');
        el.className='style-row';
        el.innerHTML=`<div class="style-name">${row.name}</div><div class="style-out"></div>`;
        el.querySelector('.style-out').textContent=row.out;
        const btn=document.createElement('button');
        btn.className='btn';
        btn.textContent='Copy';
        btn.addEventListener('click',()=>copy(row.out));
        el.appendChild(btn);
        box.appendChild(el);
    });
}

function renderCombos(){

            b.type='button';
            b.className='combo';
            b.textContent=txt;
            b.addEventListener('click',()=>copy(txt));
            box.appendChild(b);

}
