const list = document.getElementById('list');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const counts = document.getElementById('counts');

function group(rows) {
    const map = new Map();
    rows.forEach(row => {
        if (!map.has(row.shop)) map.set(row.shop, []);
        map.get(row.shop).push(row);
    });
    return map;
}

function matches(row, q) {
    if (!q) return true;
    const blob = [row.shop, row.editor, row.section, row.index, row.submesh, row.notes, row.texture].join(' ').toLowerCase();
    return blob.includes(q);
}

async function copyName(name, btn) {
    try {
        await navigator.clipboard.writeText(name);
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => btn.textContent = old, 1200);
    } catch {}
}

function render() {
    const q = search.value.trim().toLowerCase();
    const rows = DATA.filter(r => matches(r, q));
    const grouped = group(rows);
    counts.textContent = `${rows.length} submeshes · ${grouped.size} items`;
    list.innerHTML = '';
    empty.classList.toggle('hidden', rows.length !== 0);

    grouped.forEach((items, shop) => {
        const editor = items.find(i => i.editor)?.editor || '—';
        const card = document.createElement('div');
        card.className = 'shop-card';
        const rowsHtml = items.map(item => {
            const tex = item.texture.startsWith('http')
                ? `<a class="tex" href="${item.texture}" target="_blank" rel="noopener">texture</a>`
                : (item.texture || '—');
            return `<tr>
                <td>${item.section || '—'}</td>
                <td class="text-green font-bold">${item.index || '—'}</td>
                <td class="mono">${item.submesh || '—'}</td>
                <td>${item.notes || '—'}</td>
                <td>${tex}</td>
                <td><button class="copy-mini" data-name="${item.submesh.replace(/"/g,'&quot;')}">Copy</button></td>
            </tr>`;
        }).join('');
        card.innerHTML = `
            <button class="shop-head" type="button">
                <div>
                    <div class="text-[9px] uppercase tracking-[0.16em] font-bold text-slate-600">Shop item</div>
                    <div class="text-sm font-bold text-white mt-0.5">${shop}</div>
                    <div class="text-[11px] text-slate-500 mt-0.5">${editor} · ${items.length} submesh${items.length===1?'':'es'}</div>
                </div>
                <div class="text-purple text-xs font-bold">▾</div>
            </button>
            <div class="px-2 pb-2 overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>Section</th>
                            <th>Index</th>
                            <th>Submesh</th>
                            <th>Notes</th>
                            <th>Texture</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>`;
        card.querySelectorAll('.copy-mini').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                copyName(btn.dataset.name, btn);
            });
        });
        list.appendChild(card);
    });
}

search.addEventListener('input', render);
render();
</script>
