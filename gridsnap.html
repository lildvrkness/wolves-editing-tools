<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Snap — Wolves Editing Tools</title>
    <link rel="icon" href="https://images.guns.lol/16f3e8100b90f74a02cab427aa3aca5b31ff33c5/XqyQY34lHkFWU.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=New+Rocker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script>tailwind.config={theme:{extend:{colors:{purple:"#9b5cff",green:"#39ff88"}}}}</script>
    <style>
        :root { --purple:#9b5cff; --green:#39ff88; --ink:#030405; }
        * { box-sizing:border-box; }
        html { min-height:100%; background:var(--ink); }
        body {
            margin:0; min-height:100vh; font-family:Inter,sans-serif; color:#e5e7eb;
            background:
                radial-gradient(ellipse 720px 560px at 8% 8%, rgba(155,92,255,.18), transparent 68%),
                radial-gradient(ellipse 720px 560px at 94% 92%, rgba(57,255,136,.12), transparent 68%),
                #030405;
            padding:28px 16px 48px;
        }
        .background-grid {
            position:fixed; inset:0; pointer-events:none; opacity:.028; z-index:0;
            background-image:linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px);
            background-size:42px 42px;
        }
        .wolf-bg { position:fixed; right:-60px; bottom:-80px; width:min(420px,55vw); opacity:.07; pointer-events:none; z-index:0; }
        .wolves-title { font-family:"New Rocker",cursive; letter-spacing:.025em; line-height:1.02; }
        .title-wolves { color:#39ff88; display:inline-block; text-shadow:0 0 10px rgba(57,255,136,.55),0 0 24px rgba(57,255,136,.28); animation:wolvesPulse 2.8s ease-in-out infinite; }
        .title-rest { color:#9b5cff; display:inline-block; text-shadow:0 0 12px rgba(155,92,255,.55),0 0 24px rgba(155,92,255,.22); animation:albedoShimmer 4.2s ease-in-out infinite; }
        @keyframes wolvesPulse { 0%,100%{text-shadow:0 0 8px rgba(57,255,136,.4),0 0 18px rgba(57,255,136,.18)} 50%{text-shadow:0 0 16px rgba(57,255,136,.85),0 0 32px rgba(57,255,136,.4)} }
        @keyframes albedoShimmer { 0%,100%{text-shadow:0 0 10px rgba(155,92,255,.4),0 0 20px rgba(155,92,255,.18)} 50%{text-shadow:0 0 18px rgba(155,92,255,.8),0 0 32px rgba(155,92,255,.3)} }
        .card { background:linear-gradient(145deg, rgba(17,18,22,.96), rgba(8,9,11,.97)); border:1px solid #202229; border-radius:14px; }
        .shell { box-shadow:0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(155,92,255,.08); }
        .input { width:100%; height:46px; background:rgba(3,4,5,.88); border:1px solid #292c34; border-radius:10px; padding:10px 12px; color:white; font-size:15px; outline:none; }
        .input:focus { border-color:#9b5cff; box-shadow:0 0 0 2px rgba(155,92,255,.08), 0 0 16px rgba(155,92,255,.22); }
        .label { font-size:14px; color:#e2e8f0; font-weight:600; display:block; margin-bottom:6px; }
        .panel-title { font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; margin-bottom:12px; }
        .btn { height:42px; padding:0 12px; border-radius:10px; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; border:0; }
        .btn-green { background:#39ff88; color:#041208; }
        .btn-ghost { background:rgba(155,92,255,.1); color:#e8dcff; border:1px solid rgba(155,92,255,.35); }
        .chip { height:34px; padding:0 10px; border-radius:999px; border:1px solid #2a2d35; background:rgba(0,0,0,.35); color:#e2e8f0; font-size:12px; font-weight:700; }
        .chip.on { border-color:rgba(155,92,255,.7); color:#fff; background:rgba(155,92,255,.12); }
        .out { font-variant-numeric:tabular-nums; font-size:28px; font-weight:800; letter-spacing:-.04em; color:#fff; text-shadow:0 0 16px rgba(155,92,255,.35); }
        .mono { font-family:ui-monospace,Menlo,monospace; }
        .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px); opacity:0; transition:.25s ease; z-index:20; background:#0b0c10; border:1px solid rgba(57,255,136,.3); color:#39ff88; padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="background-grid"></div>
    <img class="wolf-bg" src="https://images.guns.lol/16f3e8100b90f74a02cab427aa3aca5b31ff33c5/XqyQY34lHkFWU.png" alt="">
    <main class="relative z-10 w-full max-w-5xl mx-auto">
        <div class="card shell overflow-hidden">
            <header class="px-5 md:px-7 pt-6 pb-5 border-b border-[#1c1e24]">
                <div class="flex items-center gap-2 mb-2">
                    <a href="index.html" class="back-link">← Tools</a>
                    <span class="h-1 w-1 rounded-full bg-green/70"></span>
                    <span class="text-sm uppercase tracking-[0.16em] font-bold text-purple">Placement</span>
                </div>
                <h1 class="wolves-title text-4xl md:text-5xl">
                    <span class="title-wolves">Wolves</span>
                    <span class="title-rest">Grid Snap</span>
                </h1>
                <p class="text-sm text-slate-300 mt-3 max-w-2xl">Lock a world position to the nearest grid cell. Formula: <span class="mono text-white">snapped = round((value − origin) ÷ grid) × grid + origin</span></p>
            </header>

            <section class="p-4 md:p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="card p-4">
                        <div class="panel-title text-purple">Position</div>
                        <div class="grid grid-cols-3 gap-2">
                            <div><label class="label">X</label><input id="x" class="input" type="number" step="any" value="1.37"></div>
                            <div><label class="label">Y</label><input id="y" class="input" type="number" step="any" value="0.00"></div>
                            <div><label class="label">Z</label><input id="z" class="input" type="number" step="any" value="4.82"></div>
                        </div>
                    </div>
                    <div class="card p-4">
                        <div class="panel-title text-green">Grid</div>
                        <label class="label">Grid size</label>
                        <input id="grid" class="input" type="number" min="0.001" step="any" value="0.5">
                        <div class="flex flex-wrap gap-2 mt-3" id="presets">
                            <button class="chip" data-g="0.125">0.125</button>
                            <button class="chip" data-g="0.25">0.25</button>
                            <button class="chip on" data-g="0.5">0.5</button>
                            <button class="chip" data-g="1">1</button>
                            <button class="chip" data-g="2">2</button>
                        </div>
                        <label class="label mt-4">Origin / offset</label>
                        <input id="origin" class="input" type="number" step="any" value="0">
                        <div class="flex flex-wrap gap-2 mt-3">
                            <button class="chip on" data-mode="nearest">Nearest</button>
                            <button class="chip" data-mode="floor">Floor</button>
                            <button class="chip" data-mode="ceil">Ceil</button>
                        </div>
                    </div>
                </div>

                <div class="card p-4">
                    <div class="panel-title text-purple">Snapped</div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="p-3 rounded-xl border border-[#262830] bg-black/30">
                            <div class="text-xs uppercase tracking-[0.16em] text-purple font-bold">Snap X</div>
                            <div id="sx" class="out">0.00</div>
                            <button class="btn btn-green w-full mt-2" data-copy="sx">Copy X</button>
                        </div>
                        <div class="p-3 rounded-xl border border-[#262830] bg-black/30">
                            <div class="text-xs uppercase tracking-[0.16em] text-purple font-bold">Snap Y</div>
                            <div id="sy" class="out">0.00</div>
                            <button class="btn btn-green w-full mt-2" data-copy="sy">Copy Y</button>
                        </div>
                        <div class="p-3 rounded-xl border border-[#262830] bg-black/30">
                            <div class="text-xs uppercase tracking-[0.16em] text-purple font-bold">Snap Z</div>
                            <div id="sz" class="out">0.00</div>
                            <button class="btn btn-green w-full mt-2" data-copy="sz">Copy Z</button>
                        </div>
                    </div>
                    <button id="copyAll" class="btn btn-green w-full mt-3">Copy X, Y, Z</button>
                    <div class="text-sm text-slate-400 mt-3" id="delta">Moved 0</div>
                    <div class="text-xs text-slate-500 mt-2 mono" id="formulaOut"></div>
                    <button id="reset" class="btn btn-ghost w-full mt-3">Reset</button>
                </div>
            </section>
        </div>
    </main>
    <div class="toast" id="toast">Copied</div>
<script>
let mode = 'nearest';
const $ = (id) => document.getElementById(id);
function num(el) { const v = parseFloat(el.value); return Number.isFinite(v) ? v : 0; }
function snap(value, grid, origin) {
    if (!grid) return value;
    const t = (value - origin) / grid;
    let n = mode === 'floor' ? Math.floor(t) : mode === 'ceil' ? Math.ceil(t) : Math.round(t);
    return n * grid + origin;
}
function fmt(v) { return (Math.round(v * 10000) / 10000).toFixed(4).replace(/\.?0+$/, (m) => m.includes('.') ? m.replace(/0+$/,'').replace(/\.$/,'') : m); }
function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._id); toast._id = setTimeout(() => t.classList.remove('show'), 1200);
}
function calc() {
    const g = Math.max(0.0001, num($('grid')));
    const o = num($('origin'));
    const x = num($('x')), y = num($('y')), z = num($('z'));
    const sx = snap(x,g,o), sy = snap(y,g,o), sz = snap(z,g,o);
    $('sx').textContent = fmt(sx);
    $('sy').textContent = fmt(sy);
    $('sz').textContent = fmt(sz);
    const d = Math.hypot(sx-x, sy-y, sz-z);
    $('delta').textContent = 'Moved ' + fmt(d) + ' units from the entered position.';
    $('formulaOut').textContent = 'snapped = ' + mode + '((value − ' + fmt(o) + ') ÷ ' + fmt(g) + ') × ' + fmt(g) + ' + ' + fmt(o);
}
['x','y','z','grid','origin'].forEach(id => $(id).addEventListener('input', calc));
document.getElementById('presets').addEventListener('click', (e) => {
    const b = e.target.closest('[data-g]'); if (!b) return;
    $('grid').value = b.dataset.g;
    document.querySelectorAll('#presets .chip').forEach(c => c.classList.toggle('on', c === b));
    calc();
});
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(c => c.classList.toggle('on', c === b));
    calc();
}));
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    await navigator.clipboard.writeText($(b.dataset.copy).textContent);
    toast('Copied');
}));
$('copyAll').addEventListener('click', async () => {
    await navigator.clipboard.writeText([$('sx').textContent, $('sy').textContent, $('sz').textContent].join(', '));
    toast('Copied X, Y, Z');
});
$('reset').addEventListener('click', () => {
    $('x').value = 0; $('y').value = 0; $('z').value = 0; $('origin').value = 0; $('grid').value = 0.5;
    mode = 'nearest';
    document.querySelectorAll('[data-mode]').forEach(c => c.classList.toggle('on', c.dataset.mode === 'nearest'));
    calc();
});
calc();
</script>
<script src="fx.js"></script>
</body>
</html>
